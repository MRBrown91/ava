services:
  db:
    image: postgres:15-alpine
    container_name: ava_db
    environment:
      POSTGRES_USER: ${DATABASE_USER:-ava}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-password}
      POSTGRES_DB: ${DATABASE_NAME:-ava_development}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ava_app
    command: >
      bash -c "
        rm -f tmp/pids/server.pid &&
        bin/rails server -b 0.0.0.0
      "
    volumes:
      - .:/rails
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      DATABASE_HOST: db
      DATABASE_USER: ${DATABASE_USER:-ava}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-password}
      DATABASE_NAME: ${DATABASE_NAME:-ava_development}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      SOLID_QUEUE_IN_PUMA: ${SOLID_QUEUE_IN_PUMA:-false}
    depends_on:
      - db

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ava_worker
    command: >
      bash -c "
        bin/jobs
      "
    volumes:
      - .:/rails
    environment:
      RAILS_ENV: development
      DATABASE_HOST: db
      DATABASE_USER: ${DATABASE_USER:-ava}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-password}
      DATABASE_NAME: ${DATABASE_NAME:-ava_development}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:
  gem_cache:
